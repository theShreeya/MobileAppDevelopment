<!DOCTYPE html>
<html>
<head>
  <title>NutriLife Table and Form</title>
</head>
<body>

  <h2>NutriLife Products</h2>
  <table border ="1" style="border-collapse: collapse;">
    <tr>
      <th colspan="3">NutriLife</th>
    </tr>
    <tr>
      <th>Product Name</th>
      <th>Price</th>
      <th>Description</th>
    </tr>
    <tr>
      <td>Meal Plan</td>
      <td>$10</td>
      <td>Includes a diet chart</td>
    </tr>
    <tr>
      <td>Water Bottle</td>
      <td>$5</td>
      <td>Keeps water cool and tracks drinking</td>
    </tr>
  </table>

  <h2>Order Now</h2>
  <form>
    <p>
      <label for="name">Enter your name:</label><br>
      <input type="text" id="name" name="name" placeholder="Full Name">
    </p>
      <p>
      <label for="area">Select your area:</label><br>
      <select id="area" name="area">
        <option value="">Location</option>
        <option value="kathmandu">Kathmandu</option>
        <option value="lalitpur">Lalitpur</option>
        <option value="bhaktapur">Bhaktapur</option>
        <option value="pokhara">Pokhara</option>
      </select>
    </p>

    <p>
      <input type="submit" value="Submit">
    </p>
  </form>

</body>
</html>
